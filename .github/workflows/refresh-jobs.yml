name: refresh-jobs

# Wakes the free-tier host and asks it to refresh the real job feeds. The app
# enforces a 6-hour cooldown itself (Remotive asks for at most 4 requests a
# day), so extra or manual runs are harmless.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask CareerOS to refresh
        env:
          URL: https://careeros-esm5.onrender.com
        run: |
          # A sleeping free instance can take a minute or more to wake.
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 90 -X POST "$URL/api/jobs/sync" -o resp.json; then break; fi
            echo "attempt $i failed, retrying"; sleep 30
          done
          cat resp.json; echo
          python3 - <<'PY'
          import json
          r = json.load(open("resp.json"))
          assert r.get("result") in ("started", "fresh", "busy"), r
          PY
